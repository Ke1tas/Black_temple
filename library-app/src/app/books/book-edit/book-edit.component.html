<div class="container mt-4">
  <div class="card">
    <div class="card-header bg-dark text-white">
      {{ isNewBook ? 'Добавить новую книгу' : 'Редактировать книгу' }}
    </div>
    <div class="card-body">
      <form [formGroup]="bookForm" (ngSubmit)="onSubmit()">
        <div class="mb-3">
          <label for="title" class="form-label">Название книги</label>
          <input type="text" class="form-control" id="title" formControlName="title"
                 [ngClass]="{ 'is-invalid': bookForm.get('title')?.invalid && bookForm.get('title')?.touched }">
          <div *ngIf="bookForm.get('title')?.invalid && bookForm.get('title')?.touched" 
               class="invalid-feedback">
            Пожалуйста, укажите название книги
          </div>
        </div>

        <div class="mb-3">
          <label for="publicationYear" class="form-label">Год издания</label>
          <input type="number" class="form-control" id="publicationYear" formControlName="publicationYear"
                 [ngClass]="{ 'is-invalid': bookForm.get('publicationYear')?.invalid && bookForm.get('publicationYear')?.touched }">
          <div *ngIf="bookForm.get('publicationYear')?.errors?.['required']" 
               class="invalid-feedback">
            Укажите год издания
          </div>
          <div *ngIf="bookForm.get('publicationYear')?.errors?.['min'] || bookForm.get('publicationYear')?.errors?.['max']" 
               class="invalid-feedback">
            Год должен быть между 1800 и {{ currentYear }}
          </div>
        </div>

        <div class="mb-3">
          <label for="genre" class="form-label">Жанр</label>
          <select class="form-select" id="genre" formControlName="genre"
                  [ngClass]="{ 'is-invalid': bookForm.get('genre')?.invalid && bookForm.get('genre')?.touched }">
            <option value="">Выберите жанр...</option>
            <option *ngFor="let genre of genres" [value]="genre">{{ genre }}</option>
          </select>
          <div *ngIf="bookForm.get('genre')?.invalid && bookForm.get('genre')?.touched" 
               class="invalid-feedback">
            Пожалуйста, выберите жанр
          </div>
        </div>

        <div class="mb-3 form-check">
          <input type="checkbox" class="form-check-input" id="isAvailable" formControlName="isAvailable">
          <label class="form-check-label" for="isAvailable">Доступна для выдачи</label>
        </div>

        <div class="d-flex justify-content-end gap-2">
          <button type="button" class="btn btn-secondary" (click)="onCancel()">Отмена</button>
          <button type="submit" class="btn btn-primary" [disabled]="bookForm.invalid">
            {{ isNewBook ? 'Добавить' : 'Сохранить' }}
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
