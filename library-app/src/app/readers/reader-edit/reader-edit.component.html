<div class="container py-4">
  <div class="card shadow-sm">
    <div class="card-header bg-dark text-white py-3">
      <h5 class="mb-0">
        <i class="bi bi-person-gear me-2"></i>
        {{ isNewReader ? 'Новый читатель' : 'Редактирование читателя' }}
      </h5>
    </div>
    <div class="card-body">
      <form [formGroup]="readerForm" (ngSubmit)="onSubmit()">
        <div class="row g-3 mb-3">
          <div class="col-md-6">
            <label class="form-label">ФИО *</label>
            <input type="text" class="form-control" formControlName="fullName"
                   [ngClass]="{ 'is-invalid': readerForm.get('fullName')?.invalid && readerForm.get('fullName')?.touched }">
            <div class="invalid-feedback">
              Укажите полное ФИО (минимум 5 символов)
            </div>
          </div>

          <div class="col-md-6">
            <label class="form-label">Email *</label>
            <input type="email" class="form-control" formControlName="email"
                   [ngClass]="{ 'is-invalid': readerForm.get('email')?.invalid && readerForm.get('email')?.touched }">
            <div class="invalid-feedback">
              Введите корректный email
            </div>
          </div>

          <div class="col-md-6">
            <label class="form-label">Телефон</label>
            <input type="tel" class="form-control" formControlName="phone">
          </div>

          <div class="col-md-6">
            <label class="form-label">Книг на руках *</label>
            <input type="number" class="form-control" formControlName="booksBorrowed"
                   [ngClass]="{ 'is-invalid': readerForm.get('booksBorrowed')?.invalid && readerForm.get('booksBorrowed')?.touched }">
            <div class="invalid-feedback">
              Укажите число ≥ 0
            </div>
          </div>

          <div class="col-12">
            <label class="form-label">Адрес</label>
            <input type="text" class="form-control" formControlName="address">
          </div>

          <div class="col-12">
            <div class="form-check form-switch">
              <input class="form-check-input" type="checkbox" id="isActive" formControlName="isActive">
              <label class="form-check-label" for="isActive">Активный читатель</label>
            </div>
          </div>
        </div>

        <div class="d-flex justify-content-end gap-2">
          <button type="button" class="btn btn-outline-secondary" (click)="onCancel()">
            <i class="bi bi-x-circle me-1"></i> Отмена
          </button>
          <button type="submit" class="btn btn-primary" [disabled]="readerForm.invalid">
            <i class="bi bi-check-circle me-1"></i> 
            {{ isNewReader ? 'Добавить' : 'Сохранить' }}
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
