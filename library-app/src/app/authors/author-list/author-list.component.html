<div class="container mt-4">
    <h2>Список авторов</h2>
    <button class="btn btn-primary mb-3" (click)="addAuthor()">Добавить автора</button>
    
    <div class="table-responsive">
      <table class="table table-striped table-hover">
        <thead class="thead-dark">
          <tr>
            <th>Имя</th>
            <th>Дата рождения</th>
            <th>Страна</th>
            <th>Количество книг</th>
            <th>Биография</th>
            <th>Действия</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let author of authors">
            <td>{{ author.name }}</td>
            <td>{{ author.birthDate | date:'dd.MM.yyyy' }}</td>
            <td>{{ author.country }}</td>
            <td>{{ author.booksWritten }}</td>
            <td>{{ author.biography }}</td>
            <td>
              <button class="btn btn-sm btn-warning me-2" (click)="editAuthor(author.id)">
                Редактировать
              </button>
              <button class="btn btn-sm btn-danger" (click)="deleteAuthor(author.id)">
                Удалить
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
